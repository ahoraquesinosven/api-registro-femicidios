services:
  dev:
    image: observatorio/api-registro-femicidios
    user: "${HOST_UID}:${HOST_GID}"
    build:
      context: .
      target: development
    develop:
      watch:
        - path: package.json
          action: rebuild
    volumes:
      - './knexfile.mjs:/opt/project/knexfile.mjs'
      - './package.json:/opt/project/package.json'
      - './src:/opt/project/src'
      - './spec:/opt/project/spec'
      - './migrations:/opt/project/migrations'
      - './test:/opt/project/test'
    ports:
      - '8080:8080'
    env_file:
      - .env.defaults
      - .env

  swagger-ui:
    image: swaggerapi/swagger-ui
    ports:
      - '8081:8080'
    environment:
      - SWAGGER_JSON_URL=http://localhost:8080/v1/openapi.json
      - OAUTH_CLIENT_ID=1234
      - OAUTH_USE_PKCE=true

  db:
    image: postgres:11
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=observatorio-femicidios
      - POSTGRES_USER=vivas
      - POSTGRES_PASSWORD=nosqueremos

volumes:
  pgdata:
