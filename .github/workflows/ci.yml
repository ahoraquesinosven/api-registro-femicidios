name: CI

on:
  pull_request:
    branches: [dev, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Run tests
        run: |
          set -a && . ./.env.defaults && set +a
          npm test
        env:
          NODE_ENV: ci
