name: CI

on:
  pull_request:
    branches: [dev, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      # OpenAPI validation boots the app config. NODE_ENV=ci relaxes the entries
      # flagged optionalInCi (the Google OAuth secrets); .env.defaults supplies
      # the rest, exactly as it does for local dev via compose's env_file.
      - name: Validate OpenAPI document
        run: |
          set -a && . ./.env.defaults && set +a
          npm test
        env:
          NODE_ENV: ci
